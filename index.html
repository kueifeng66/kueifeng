        @keyframes pulse {
            0% { transform: scale(1); }

        /* Modal Overlay & Card */

            display: flex;

            color: #333;
        }
        .review-close {
            background: none;
            border: none;
            font-size: 2.2rem;
            color: #888;

            line-height: 1;
            padding: 0 0.5rem;
        }
        .review-close:hover {

        .review-body {

        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

const noAutoLogoutUsers = [
  "kueifeng7166@gmail.com",
  "shinchir46@gmail.com",
  "qqcats0901@mail.post.gov.tw",
  "chinjiewan@anws.gov.tw"
];

const adminEmails = [
  "kueifeng7166@gmail.com"
];

let pendingUsersMap = {};

function initAdminReviewSystem(userEmail) {
  if (!adminEmails.includes(userEmail)) return;

  const reviewBtn = document.getElementById("admin-review-btn");
  const pendingBadge = document.getElementById("pending-badge");
  const modal = document.getElementById("review-modal");
  const modalClose = document.getElementById("review-modal-close");
  const pendingList = document.getElementById("pending-users-list");

  reviewBtn.style.display = "block";

  reviewBtn.addEventListener("click", () => {
    modal.classList.add("show");
  });

  modalClose.addEventListener("click", () => {
    modal.classList.remove("show");
  });

  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.classList.remove("show");
  });

  // Listen to users collection in real time
  const usersRef = ref(database, "users");
  onValue(usersRef, (snapshot) => {
    pendingUsersMap = {};
    if (snapshot.exists()) {
      const data = snapshot.val();
      Object.keys(data).forEach((uid) => {
        if (data[uid] && data[uid].approved === false) {
          pendingUsersMap[uid] = data[uid];
        }
      });
    }

    const pendingKeys = Object.keys(pendingUsersMap);
    const count = pendingKeys.length;

    if (count > 0) {
      pendingBadge.style.display = "block";
      pendingBadge.textContent = count > 99 ? "99+" : count;
      reviewBtn.title = `${count} pending registration approval(s)`;
    } else {
      pendingBadge.style.display = "none";
      reviewBtn.title = "Review registrations (0 pending)";
    }

    // Render list inside modal
    if (count === 0) {
      pendingList.innerHTML = `<div class="empty-pending">No pending user registrations.</div>`;
    } else {
      pendingList.innerHTML = pendingKeys.map((uid) => {
        const u = pendingUsersMap[uid];
        const dateStr = u.createdAt ? new Date(u.createdAt).toLocaleString() : "";
        return `
          <div class="pending-item" id="item-${uid}">
            <div class="pending-info">
              <div class="pending-name">${escapeHtml(u.displayName || "No Name")}</div>
              <div>${escapeHtml(u.email || "")}</div>
              ${dateStr ? `<div class="pending-time">${dateStr}</div>` : ""}
            </div>
            <div class="pending-actions">
              <button type="button" class="btn-approve" data-uid="${uid}" title="Approve registration">Approve</button>
              <button type="button" class="btn-deny" data-uid="${uid}" title="Deny registration">Deny</button>
            </div>
          </div>
        `;
      }).join("");

      pendingList.querySelectorAll(".btn-approve").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const targetUid = btn.getAttribute("data-uid");
          btn.disabled = true;
          btn.textContent = "Approving...";
          try {
            await update(ref(database, `users/${targetUid}`), { 
              approved: true,
              status: "approved"
            });
          } catch (err) {
            alert("Error approving user: " + err.message);
            btn.disabled = false;
            btn.textContent = "Approve";
          }
        });
      });

      pendingList.querySelectorAll(".btn-deny").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const targetUid = btn.getAttribute("data-uid");
          const targetUser = pendingUsersMap[targetUid];
          const name = targetUser?.displayName || targetUser?.email || "this user";
          if (!confirm(`Are you sure you want to deny ${name}?`)) {
            return;
          }
          btn.disabled = true;
          btn.textContent = "Denying...";
          try {
            await update(ref(database, `users/${targetUid}`), { 
              approved: "denied",
              status: "denied"
            });
          } catch (err) {
            alert("Error denying user: " + err.message);
            btn.disabled = false;
            btn.textContent = "Deny";
          }
        });
      });
    }
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>'"]/g, 
    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
  );
}

        // inside your module after successful login:
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  // Check approval status in Realtime Database for new registrations
  try {
    const snap = await get(ref(database, `users/${user.uid}`));
    if (snap.exists()) {
      const data = snap.val();
      if (data.approved === false) {
        await signOut(auth);
        window.location.href = "login.html";
        return;
      }
    }
  } catch (err) {
    console.warn("Approval check error:", err);
  }
  
  //  store globally
  window.currentUserEmail = user.email;
  resetTimer();
  initAdminReviewSystem(user.email);

  const iframe = document.getElementById('website-frame');
  iframe.src = `site1/index.html?userEmail=${encodeURIComponent(user.email)}`;

  // When iframe loads, tell it to try scrolling (useful on first login)
  iframe.addEventListener('load', () => {
    try {
      iframe.contentWindow.postMessage({ type: 'scrollToUser', userEmail: window.currentUserEmail }, '*');
    } catch (e) {
      console.warn('postMessage failed', e);
    }
  }, { once: true });
});

        


window.logout = function() {

        
        clearTimeout(Timer); // auto logout
        clearInterval(logInterval); // auto logout

        // Change SVG content when logging out
        const svgElement = document.querySelector("button#logout-btn svg");

        svgElement.innerHTML = `
         <rect x="5" y="11" width="14" height="10" rx="2" ry="2" fill="white" stroke="white" stroke-width="1" />
         <path d="M8 11V7c0-2.2 -1.8 -4 -4 -4s-4 1.8 -4 4v1" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" />
         <circle cx="12" cy="16" r="1.5" fill="#007BFF" />
          <path d="M12 16v2" stroke="#007BFF" stroke-width="1" stroke-linecap="round" />
        `;
    
            signOut(auth).then(() => {
            //alert("Logged out successfully!");
            window.location.href = "login.html"; // Redirect to login page
            }).catch(error => {
             alert("Error logging out: " + error.message);
        });
    }


        //auto logout 
let countDown = 360000; // 6 min in milliseconds
let Timer;
let logInterval; // For logging time remaining

// Function to reset the timer
function resetTimer() {

    const user = auth.currentUser;
    if (noAutoLogoutUsers.includes(window.currentUserEmail)) {
        console.log(`Auto logout disabled for ${window.currentUserEmail}`);
        // Make sure no timers are running
        clearTimeout(Timer);
        clearInterval(logInterval);
        return; // Skip starting auto logout
    }
    // Clear existing timers
    clearTimeout(Timer);
    clearInterval(logInterval);
    
    // Set new timeout for logout
    const startTime = Date.now();
    Timer = setTimeout(logout, countDown);
    
    // Set interval to log remaining time every 1 seconds
    logInterval = setInterval(() => {
        const elapsedTime = Date.now() - startTime;
        const remainingTime = countDown - elapsedTime;
        
        if (remainingTime > 0) {
            const seconds = Math.floor(remainingTime / 1000);
            console.log(`Time until logout: ${seconds} seconds`);
        }
    }, 1000); // Log every 1 seconds
}

// Initialize the timer when the page loads
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    // Document already loaded, initialize immediately
    initializeInactivityTimer();
} else {
    // Wait for the document to load
    document.addEventListener('DOMContentLoaded', initializeInactivityTimer);
}

function initializeInactivityTimer() {
    // Start the timer when the page loads
    console.log("Initializing inactivity timer: 30 minutes until logout");
    resetTimer();
    
    // Reset the timer on user activity
    document.addEventListener('mousemove', resetTimer);
    document.addEventListener('mousedown', resetTimer);
    document.addEventListener('keypress', resetTimer);
    document.addEventListener('touchmove', resetTimer);
    document.addEventListener('touchstart', resetTimer);
    
    
    // Also add event listener to the iframe to detect activity inside it
    const iframe = document.getElementById('website-frame');
    iframe.addEventListener('load', function() {
        try {
            // Add event listeners to the iframe content if same-origin
            iframe.contentDocument.addEventListener('mousemove', resetTimer);
            iframe.contentDocument.addEventListener('mousedown', resetTimer);
            iframe.contentDocument.addEventListener('keypress', resetTimer);
            iframe.contentDocument.addEventListener('touchmove', resetTimer);
            iframe.contentDocument.addEventListener('touchstart', resetTimer);
           
        } catch (e) {
            // If cross-origin, we cannot access the iframe content directly
            console.log("Cannot add events to iframe content: same-origin policy");
        }
    });
}

    </button>

    <script>
        const sites = [
            { src: 'site1/index.html', favicon: 'favicon1.ico' },
            { src: 'site2/index.html', favicon: 'favicon2.ico' },
            { src: 'site3/index.html', favicon: 'favicon3.ico' },
            { src: 'site4/index.html', favicon: 'favicon4.ico' },
            { src: 'site5/index.html', favicon: 'favicon5.ico' },
            { src: 'site6/index.html', favicon: 'favicon6.ico' },
			{ src: 'site7/index.html', favicon: 'favicon6.ico' },
        ];
        let currentSiteIndex = 0;
       

       
function switchWebsite() {
  currentSiteIndex = (currentSiteIndex + 1) % sites.length;
  const frame = document.getElementById('website-frame');
  const favicon = document.getElementById('favicon');

  // build src and append userEmail if we have it
  let src = sites[currentSiteIndex].src;
  if (window.currentUserEmail) {
    src += (src.includes('?') ? '&' : '?') + 'userEmail=' + encodeURIComponent(window.currentUserEmail);
  }

  // set src (this will reload the iframe)
  frame.src = src;
  favicon.href = sites[currentSiteIndex].favicon;

  // After it loads, ask it to scroll (postMessage)
  const onLoad = () => {
    try {
      frame.contentWindow.postMessage({ type: 'scrollToUser', userEmail: window.currentUserEmail }, '*');
    } catch (e) {
      console.warn('postMessage to iframe failed', e);
    }
    frame.removeEventListener('load', onLoad);
  };
  frame.addEventListener('load', onLoad);
}



    </script>
